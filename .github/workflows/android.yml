name: Build Surya Pro YouTube APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4  # Yahan v3 se v4 kiya gaya hai

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Extract wala step hata diya gaya hai
      
      - name: Build APK
        run: gradle assembleDebug # Ye command direct main folder mein chalegi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SuryaProYouTube-APK
          path: app/build/outputs/apk/debug/app-debug.apk # Path check kar lein
